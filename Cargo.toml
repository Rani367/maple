[package]
name = "maple-cli"
version = "0.1.0"
edition = "2024"
description = "A fast, local repo map, wiki, and context pack generator."
license = "MIT"
repository = "https://github.com/Rani367/maple"

[[bin]]
name = "maple"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
ignore = "0.4.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
assert_cmd = "2.0.17"
insta = { version = "1.43.1", features = ["json"] }
